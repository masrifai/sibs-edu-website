<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Situwangi Islamic Boarding School</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;

            font-family: Arial, sans-serif;
            color: #fff;

            /* GANTI FOTO DI SINI NANTI */
            background:
                linear-gradient(
                    rgba(8, 24, 45, .78),
                    rgba(8, 24, 45, .88)
                ),
                url("assets/images/2.jpeg")
                center center / cover no-repeat;
        }

        /* efek halus background */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(8, 24, 45, .15);
            z-index: 0;
        }

        .maintenance {
            position: relative;
            z-index: 1;

            width: min(90%, 680px);
            padding: 48px 32px;

            text-align: center;

            background: rgba(8, 24, 45, .48);
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 20px;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .logo {
            width: 82px;
            height: 82px;
            object-fit: contain;
            margin-bottom: 26px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            margin-bottom: 18px;

            color: #d4a72c;
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .15em;
            text-transform: uppercase;
        }

        .eyebrow::before,
        .eyebrow::after {
            content: "";
            width: 28px;
            height: 1px;
            background: #d4a72c;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: clamp(2.2rem, 7vw, 4rem);
            font-weight: 400;
            line-height: 1.08;
            margin-bottom: 20px;
        }

        h1 em {
            color: #d4a72c;
            font-style: italic;
        }

        p {
            max-width: 520px;
            margin: 0 auto 28px;

            color: rgba(255,255,255,.75);
            font-size: .95rem;
            line-height: 1.8;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 10px 18px;

            border: 1px solid rgba(212,167,44,.5);
            border-radius: 999px;

            color: #d4a72c;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #d4a72c;
        }

        @media (max-width: 575px) {
            .maintenance {
                padding: 38px 22px;
                border-radius: 16px;
            }

            .logo {
                width: 70px;
                height: 70px;
            }

            p {
                font-size: .88rem;
            }
        }
    </style>
</head>

<body>

    <main class="maintenance">

        <!-- LOGO -->
        <img
            src="assets/images/logo/sibs.png"
            alt="Situwangi Islamic Boarding School"
            class="logo"
        >

        <div class="eyebrow">
            Situwangi Islamic Boarding School
        </div>

        <h1>
            Website sedang<br>
            <em>dalam pemeliharaan.</em>
        </h1>

        <p>
            Kami sedang melakukan pembaruan dan penyempurnaan
            website untuk memberikan pengalaman yang lebih baik.
            Mohon kembali beberapa saat lagi.
        </p>

        <div class="status">
            <span class="status-dot"></span>
            Under Maintenance
        </div>

    </main>

</body>
</html>
